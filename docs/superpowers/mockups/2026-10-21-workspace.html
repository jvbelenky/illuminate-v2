<title>Illuminate Design Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    color-scheme: dark; --mk-bg: #000; --mk-fg: #ccc;

    --color-text: #1f2328; --color-text-muted: #454b52;
    --color-primary: #e94560; --color-primary-hover: #ff6b6b;
    --color-border: #aab1ba; --color-bg-input: #eceef2;
    --color-success: #16a34a; --color-warning: #b45309; --color-danger: #dc2626;
    --color-scene-wire: #5b6779; --color-scene-selected: #ea580c;
    --lamp: #7c3aed;
    --grid-minor: rgba(60,70,85,.10); --grid-major: rgba(60,70,85,.22);
    --room-fill: rgba(91,103,121,.14);
    --mk-bg: #fff; --mk-fg: #333; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --color-bg: #d6dae0; --color-bg-secondary: #e4e7eb; --color-bg-tertiary: #f1f3f5;
    --color-text: #1f2328; --color-text-muted: #454b52;
    --color-primary: #e94560; --color-primary-hover: #ff6b6b;
    --color-border: #aab1ba; --color-bg-input: #eceef2;
    --color-success: #16a34a; --color-warning: #b45309; --color-danger: #dc2626;
    --color-scene-wire: #5b6779; --color-scene-selected: #ea580c;
    --lamp: #7c3aed;
    --grid-minor: rgba(60,70,85,.10); --grid-major: rgba(60,70,85,.22);
    --room-fill: rgba(91,103,121,.14);
    --mk-bg: #fff; --mk-fg: #333; color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: .875rem;
         background: var(--color-bg); color: var(--color-text); display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }
  input, select { font: inherit; color: var(--color-text); background: var(--color-bg-input);
         border: 1px solid var(--color-border); border-radius: 4px; padding: 4px 6px; }
  input[type=range] { padding: 0; accent-color: var(--color-primary); background: none; border: 0; }
  input[type=checkbox] { accent-color: var(--color-primary); }

  .mk { display: flex; align-items: center; gap: 14px; padding: 6px 14px; background: var(--mk-bg); color: var(--mk-fg); border-bottom: 1px solid var(--color-border); font-size: .75rem; flex: none; }
  .mk b { font-size: .8rem; }
  .mk .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--color-border); border-radius: 6px; overflow: hidden; }
  .seg button { font-size: .72rem; padding: 4px 10px; border: 0; background: transparent; color: inherit; opacity: .7; }
  .seg button.on { background: var(--color-primary); color: #fff; opacity: 1; }

  .menubar { display: flex; gap: 16px; align-items: center; padding: 0 12px; height: 30px; flex: none; font-size: .78rem;
             background: var(--color-bg-secondary); border-bottom: 1px solid var(--color-border); color: var(--color-text-muted); }
  .menubar .file { margin-left: auto; margin-right: auto; color: var(--color-text); }

  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr 370px; }

  /* Left: stages + current part */
  .left { background: var(--color-bg-secondary); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; min-height: 0; }
  .stages { display: flex; padding: 10px 10px 0; gap: 4px; }
  .stage { flex: 1; border: 1px solid var(--color-border); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 7px 4px; background: var(--color-bg);
           text-align: center; font-size: .78rem; color: var(--color-text-muted); position: relative; }
  .stage .n { font-size: .65rem; display: block; opacity: .8; }
  .stage.on { background: var(--color-bg-tertiary); color: var(--color-text); font-weight: 600; border-color: var(--color-primary); }
  .stage.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--color-bg-tertiary); }
  .stage .opt { font-size: .62rem; font-weight: 400; opacity: .7; }
  .stagebody { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--color-bg-tertiary); border-top: 1px solid var(--color-primary); margin: 0 10px; border-left: 1px solid var(--color-border); border-right: 1px solid var(--color-border); }
  .parts { display: flex; gap: 0; padding: 8px 6px 0; justify-content: space-between; }
  .part { border: 0; background: none; padding: 4px 7px; border-radius: 14px; font-size: .74rem; color: var(--color-text-muted); }
  .part:hover { color: var(--color-text); }
  .part.on { background: var(--color-bg); color: var(--color-text); box-shadow: inset 0 0 0 1px var(--color-primary); }
  .panel { padding: 12px; overflow: auto; flex: 1; }
  .nav { display: flex; justify-content: space-between; padding: 10px; border-top: 1px solid var(--color-border); margin: 0 10px 10px; background: var(--color-bg-tertiary);
         border-left: 1px solid var(--color-border); border-right: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border); border-radius: 0 0 8px 8px; }

  .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-bg); font-size: .8rem; }
  .btn:hover:not(:disabled) { border-color: var(--color-primary); }
  .btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: var(--color-primary-hover); }

  .btn.ghost { background: transparent; }
  .btn.on { border-color: var(--color-primary); color: var(--color-primary); }
  .btn.sm { padding: 3px 8px; font-size: .72rem; }
  .muted { color: var(--color-text-muted); }
  .lbl { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); margin: 14px 0 6px; }
  .lbl:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row > span:first-child { width: 78px; color: var(--color-text-muted); font-size: .8rem; flex: none; }
  .row input[type=number] { width: 66px; }
  .shapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .shape { aspect-ratio: 1.25; border: 1px solid var(--color-border); border-radius: 6px; background: var(--color-bg);
           display: flex; align-items: center; justify-content: center; color: var(--color-text-muted); }
  .shape:hover, .shape.on { border-color: var(--color-primary); color: var(--color-primary); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-block; font-size: .68rem; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--color-border); color: var(--color-text-muted); white-space: nowrap; }
  .chip.ok { color: var(--color-success); border-color: currentColor; }
  .chip.warn { color: var(--color-warning); border-color: currentColor; }
  .item { border: 1px solid var(--color-border); border-radius: 6px; margin: 6px 0; background: var(--color-bg); }
  .item-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; }
  .item.sel { border-color: var(--color-scene-selected); }
  .item-b { padding: 2px 10px 8px; border-top: 1px solid var(--color-border); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--lamp); display: inline-block; margin-right: 6px; }
  .refl { display: grid; grid-template-columns: 62px 1fr 48px; align-items: center; gap: 6px; margin: 6px 0; }
  .refl span { color: var(--color-text-muted); font-size: .8rem; }

  .pills button + button { border-left: 1px solid var(--color-border); }

  .dims3 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }

  .nopick { cursor: default; }
  .place4.p3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  .zrow { margin-top: 8px; }

  .lcol { flex: 1; min-width: 0; overflow: hidden; display: flex; align-items: center; gap: 8px; padding-right: 6px; }
  .lrow { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; }

  .lname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lsub { font-size: .7rem; color: var(--color-text-muted); font-style: italic; min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lamprow .tg { display: flex; gap: 4px; flex: none; }
  .ehead { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 0 14px; font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted); }
  .ehead .btn { text-transform: none; letter-spacing: 0; }
  .left.summary { padding: 12px 14px; gap: 0; overflow: auto; }
  .sumtop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .sumtop h3 { margin: 0; font-size: 1.05rem; }
  .sum { padding: 10px 0; border-top: 1px solid var(--color-border); }
  .sum-h { display: flex; width: 100%; margin: 0 0 6px; align-items: center; justify-content: space-between; padding: 7px 10px; border: 1px solid var(--color-border); border-radius: 6px; background: var(--color-bg-tertiary); color: var(--color-text); font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; text-align: left; transition: border-color .12s, background .12s; }
  .sum-h:hover { border-color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 10%, var(--color-bg-tertiary)); }
  .sum-h:active { transform: translateY(1px); }
  .sum-h .chev { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; font-size: 1rem; line-height: 1; color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 14%, transparent); }
  .sum-h:hover .chev { background: var(--color-primary); color: #fff; }
  .srow2 { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: .8rem; min-height: 26px; }
  .srow2 .sn { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .srow2 .sn small { font-size: .68rem; color: var(--color-text-muted); opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow2 b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .itog { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; padding: 0; border: 1px solid var(--color-border); border-radius: 4px; background: var(--color-bg-tertiary); color: var(--color-text-muted); cursor: pointer; }
  .itog:hover { color: var(--color-text); }
  .itog.pressed { background: color-mix(in srgb, var(--color-primary) 20%, var(--color-bg-secondary)); border-color: var(--color-primary); color: var(--color-primary); box-shadow: inset 0 1px 3px rgba(0,0,0,.2); }
  .kv { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: .8rem; }
  .kv > span { color: var(--color-text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kv.off { opacity: .5; }
  .sum .sub { margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--color-border); }
  .sum .sub .kv { font-size: .74rem; padding: 2px 0; }
  .sum .sub .kv b { font-weight: 500; }
  .dims3.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dims3.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .addcard { padding: 8px 10px; background: var(--color-bg-secondary); border: 1px solid var(--color-primary); border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
  .addcard select { width: 100%; }
  .place4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .place4 .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 2px; font-size: .68rem; }
  .place4.sm { margin-top: 6px; }
  .place4.sm .btn { font-size: .66rem; padding: 3px 2px; }
  .ribbon { display: flex; gap: 4px; }
  .ribbon .btn { display: inline-flex; align-items: center; gap: 5px; }
  .ribbon .btn.on { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
  .item .chip .dot { width: 7px; height: 7px; margin-right: 4px; }
  .disc { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: 0; border-top: 1px solid var(--color-border); padding: 9px 0 2px; margin-top: 12px; color: var(--color-text-muted); font: inherit; font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; text-align: left; }
  .disc:hover { color: var(--color-text); }

  .dimrow { display: flex; align-items: center; gap: 8px; }

  .if { display: flex; align-items: center; height: 28px; box-sizing: border-box; min-width: 0; padding: 0 6px; gap: 4px;
        background: var(--color-bg-input); border: 1px solid var(--color-border); border-radius: 4px; cursor: text; }
  .if:focus-within { border-color: var(--color-primary); }

  .lsec { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 6px; }
  .lsec .lbl { margin: 0; }

  .iseg { display: inline-flex; border: 1px solid var(--color-border); border-radius: 4px; overflow: hidden; }
  .iseg button { display: grid; place-items: center; width: 30px; height: 24px; padding: 0; border: 0; background: none; color: var(--color-text-muted); }
  .iseg button + button { border-left: 1px solid var(--color-border); }
  .iseg button:hover { background: var(--color-bg-input); color: var(--color-text); }

  .ptog button.on { border-color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 18%, transparent); color: var(--color-text); }
  .lrow2 { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

  .fplen b { font-weight: 400; font-size: .8rem; color: var(--color-text-muted); }
  .lbl.lrow { display: flex; align-items: center; justify-content: space-between; }
  .ccard { margin-top: 12px; padding: 8px 10px; border: 1px solid var(--color-border); border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
  .ccard-h { display: flex; align-items: center; justify-content: space-between; min-height: 22px; }
  .ccard-h .allname { margin: 0; }
  .crow2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .pills.ico button { display: grid; place-items: center; padding: 3px 6px; }

function wallOf(v) { return v.startsWith('wall:') ? +v.slice(5) : null; }
function wallLen(i) { const a = S.verts[i], c = S.verts[(i + 1) % S.verts.length]; return Math.hypot(c[0] - a[0], c[1] - a[1]); }

}
function elevSVG(i) {
  const n = S.verts.length, a = S.verts[i], c = S.verts[(i + 1) % n], L = wallLen(i), H = S.h;
  const ux = (c[0] - a[0]) / L, uy = (c[1] - a[1]) / L;
  // inward normal: opposite of the outward one used for plan labels
  const ix = -((c[1] - a[1]) / L), iy = (c[0] - a[0]) / L;
  const proj = (x, y) => [(x - a[0]) * ux + (y - a[1]) * uy, (x - a[0]) * ix + (y - a[1]) * iy];
  const pad = 3, G = 60;
  let g = '';
  for (let x = -G; x <= L + G; x++) g += `<line x1="${x}" y1="${-H - G}" x2="${x}" y2="${G}" stroke="var(${x % 5 ? '--grid-minor' : '--grid-major'})" stroke-width="0.05"/>`;
  for (let z = -G; z <= H + G; z++) g += `<line x1="${-G}" y1="${-z}" x2="${L + G}" y2="${-z}" stroke="var(${z % 5 ? '--grid-minor' : '--grid-major'})" stroke-width="0.05"/>`;
  const sel = S.part === 'surfaces' && S.selWall === i;
  let out = g + `<rect data-wall="${i}" x="0" y="${-H}" width="${L}" height="${H}" fill="${sel ? 'var(--color-scene-selected)' : 'var(--color-primary)'}" fill-opacity="${sel ? 0.16 : 0.08}" stroke="var(--color-scene-wire)" stroke-width="0.12" style="cursor:${S.part === 'surfaces' ? 'pointer' : 'default'}"/>`;
  out += `<line x1="${-pad}" y1="0" x2="${L + pad}" y2="0" stroke="var(--color-scene-wire)" stroke-width="0.18"/>`;
  out += `<text x="${L / 2}" y="1.4" font-size="0.7" text-anchor="middle" fill="var(--color-text-muted)">${+L.toFixed(1)}′</text>`;
  out += `<text x="-0.8" y="${-H / 2}" font-size="0.7" text-anchor="end" fill="var(--color-text-muted)">${H}′</text>`;
  out += `<text x="0" y="2.6" font-size="0.6" fill="var(--color-text-muted)">‹ Wall ${(i - 1 + n) % n + 1}</text>`;
  out += `<text x="${L}" y="2.6" font-size="0.6" text-anchor="end" fill="var(--color-text-muted)">Wall ${(i + 1) % n + 1} ›</text>`;

  S.obs.filter(o => !o.hidden).forEach(o => {

    const t0 = Math.max(0, Math.min(...pts.map(q => q[0]))), t1 = Math.min(L, Math.max(...pts.map(q => q[0])));

// the inset moves by its title bar, kept inside the views
document.addEventListener('pointerdown', e => {

  const off = [e.clientX - r.left, e.clientY - r.top];
