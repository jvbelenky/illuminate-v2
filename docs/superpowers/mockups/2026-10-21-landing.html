<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing page</title>
<style>
  /* Tokens copied from ui/src/app.css */
  :root, [data-theme="dark"] {
    --color-bg: #1a1a2e;
    --color-bg-secondary: #16213e;
    --color-bg-tertiary: #0f3460;
    --color-text: #eaeaea;
    --color-text-muted: #a0a0a0;
    --color-primary: #e94560;
    --color-primary-hover: #ff6b6b;
    --color-border: #2a2a4a;
    --backdrop: rgba(5, 8, 20, 0.6);
  }
  [data-theme="light"] {
    --color-bg: #d6dae0;
    --color-bg-secondary: #e4e7eb;
    --color-bg-tertiary: #f1f3f5;
    --color-text: #1f2328;
    --color-text-muted: #454b52;
    --color-primary: #e94560;
    --color-primary-hover: #ff6b6b;
    --color-border: #aab1ba;
    --backdrop: rgba(30, 35, 45, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.875rem;
    background: var(--color-bg); color: var(--color-text);
    transition: background .2s, color .2s;
  }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--color-border);
    background: var(--color-bg-secondary);
  }
  .toolbar h1 { margin: 0; font-size: 0.9rem; font-weight: 600; }
  .toolbar .sub { color: var(--color-text-muted); font-size: 0.75rem; margin-left: 10px; font-weight: 400; }
  .seg { display: inline-flex; border: 1px solid var(--color-border); border-radius: 6px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 0.75rem; padding: 5px 12px; border: 0; cursor: pointer;
    background: transparent; color: var(--color-text-muted);
  }
  .seg button.on { background: var(--color-primary); color: #fff; }

  .stage { padding: 24px 16px 40px; }
  .lab {
    text-align: center; font-size: 0.7rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--color-text-muted); margin: 18px 0 8px;
  }
  /* Fake app behind the modal */
  .backdrop {
    position: relative; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--color-border);
    background:
      linear-gradient(var(--backdrop), var(--backdrop)),
      repeating-linear-gradient(0deg, transparent 0 23px, color-mix(in srgb, var(--color-border) 60%, transparent) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, color-mix(in srgb, var(--color-border) 60%, transparent) 23px 24px),
      var(--color-bg);
    display: flex; align-items: center; justify-content: center;
  }
  .desk-bg { max-width: 760px; height: 400px; margin: 0 auto; }
  .mob-bg { width: 340px; height: 420px; margin: 0 auto; }

  /* Modal chrome, after Modal.svelte */
  .modal {
    background: var(--color-bg-secondary); border: 1px solid var(--color-border);
    border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.35); overflow: hidden;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--color-border);
    font-weight: 600; font-size: 0.9rem;
  }
  .modal-head .x { color: var(--color-text-muted); font-size: 1rem; line-height: 1; cursor: pointer; }
  .modal-body { padding: 18px; }

  .sq { display: grid; grid-template-columns: repeat(3, 150px); gap: 14px; }
  .choice {
    font: inherit; color: var(--color-text); cursor: pointer;
    background: var(--color-bg-tertiary); border: 1px solid var(--color-border); border-radius: 8px;
    transition: border-color .15s, transform .15s, color .15s;
  }
  .choice svg { color: var(--color-text-muted); transition: color .15s; }
  .choice:hover { border-color: var(--color-primary); }
  .choice:hover svg { color: var(--color-primary); }
  .sq .choice {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; font-weight: 600; font-size: 0.85rem;
  }
  .sq .choice:hover { transform: translateY(-2px); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .mob-bg .modal { width: 300px; }
  .list .choice {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px;
    font-weight: 600; font-size: 0.85rem; text-align: left;
  }
  .list .choice svg { flex: none; }

  .lead { margin: 0 0 16px; color: var(--color-text-muted); text-align: center; }
  .dont-show {
    display: flex; gap: 6px; align-items: center; justify-content: center;
    margin-top: 16px; font-size: 0.75rem; color: var(--color-text-muted);
  }
  .dont-show input { accent-color: var(--color-primary); }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>Landing page <span class="sub">v5</span></h1>
    <div class="seg" role="group" aria-label="Theme">
      <button data-t="dark" class="on">Dark</button>
      <button data-t="light">Light</button>
    </div>
  </div>

  <div class="stage">
    <div class="lab">Desktop</div>
    <div class="backdrop desk-bg">
      <div class="modal">
        <div class="modal-head">Start a design <span class="x">×</span></div>
        <div class="modal-body">
          <p class="lead">Illuminate is a tool for modeling germicidal UV efficacy and safety.</p>
          <div class="sq">
            <button class="choice">
              <svg width="64" height="52" viewBox="0 0 44 36" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
                <path d="M4 12l18-8 18 8v18H4z"/><path d="M4 12l18 8 18-8M22 20v10"/>
                <path d="M30 26l7-7 2 2-7 7h-2z" stroke-width="1.3"/>
              </svg>
              Start designing
            </button>
            <button class="choice">
              <svg width="64" height="52" viewBox="0 0 44 36" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
                <path d="M6 8h11l3 3h18v19H6z"/><path d="M6 15h32"/>
              </svg>
              Open a .guv file
            </button>
            <button class="choice">
              <svg width="64" height="52" viewBox="0 0 44 36" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
                <path d="M4 12l18-8 18 8v18H4z"/><path d="M4 12l18 8 18-8M22 20v10"/>
                <circle cx="22" cy="9" r="2.2" fill="currentColor" stroke="none"/>
                <path d="M22 11v2M17 21l5-8 5 8" stroke-dasharray="1.5 2"/>
              </svg>
              See an example
            </button>
          </div>
          <label class="dont-show"><input type="checkbox"> Don't show this again</label>
        </div>
      </div>
    </div>

    <div class="lab">Phone</div>
    <div class="backdrop mob-bg">
      <div class="modal">
        <div class="modal-head">Start a design <span class="x">×</span></div>
        <div class="modal-body">
          <p class="lead">Illuminate is a tool for modeling germicidal UV efficacy and safety.</p>
          <div class="list">
            <button class="choice"><svg width="40" height="32" viewBox="0 0 44 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 12l18-8 18 8v18H4z"/><path d="M4 12l18 8 18-8M22 20v10"/><path d="M30 26l7-7 2 2-7 7h-2z" stroke-width="1.3"/></svg>Start designing</button>
            <button class="choice"><svg width="40" height="32" viewBox="0 0 44 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 8h11l3 3h18v19H6z"/><path d="M6 15h32"/></svg>Open a .guv file</button>
            <button class="choice"><svg width="40" height="32" viewBox="0 0 44 36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 12l18-8 18 8v18H4z"/><path d="M4 12l18 8 18-8M22 20v10"/><circle cx="22" cy="9" r="2.2" fill="currentColor" stroke="none"/><path d="M22 11v2M17 21l5-8 5 8" stroke-dasharray="1.5 2"/></svg>See an example</button>
          </div>
          <label class="dont-show"><input type="checkbox"> Don't show this again</label>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
      document.documentElement.dataset.theme = b.dataset.t;
      document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
    }));
  </script>
</body>
</html>
