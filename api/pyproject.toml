[project]
name = "illuminate-api"
# Version of this (unpublished) API package — pinned in uv.lock, so it's left
# alone at release time. The app/release version lives in the root VERSION file.
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    # Pinned by commit; bump with `make bump-guv-calcs` (see scripts/guv-calcs.sh)
    "guv-calcs @ git+https://github.com/jvbelenky/guv-calcs@c143dc5b415f6dab3dd35f9ea19bb8647faf4ca0",
    "jinja2>=3.1,<4",
    "weasyprint>=62,<70",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pypdf>=4,<6",
]

[tool.uv]
package = false
